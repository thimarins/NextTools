[package]
name = "nexttool-desktop"
description = "NextTool desktop (Tauri 2): camada de IPC sobre os motores; a UI fica em /ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "NextTool"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
nexttool-core.workspace = true
nexttool-store.workspace = true
nexttool-tasks.workspace = true
nextsize-core.workspace = true
nextsize-index.workspace = true
nextcopy-core.workspace = true
nextcopy-robocopy.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"

[dev-dependencies]
tempfile.workspace = true

[features]
# Embeds ui/dist into the binary (production). `cargo build` uses it by default.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
