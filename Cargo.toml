[workspace]
resolver = "2"
members = [
    "crates/nextsize-core",
    "crates/nextsize-windows",
    "crates/nextsize-scanner",
    "crates/nextsize-index",
    "crates/nextsize-benchmark",
    "crates/nextsize-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Proprietary"
rust-version = "1.80"

[workspace.dependencies]
nextsize-core = { path = "crates/nextsize-core" }
nextsize-windows = { path = "crates/nextsize-windows" }
nextsize-scanner = { path = "crates/nextsize-scanner" }
nextsize-index = { path = "crates/nextsize-index" }
nextsize-benchmark = { path = "crates/nextsize-benchmark" }

thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"
rusqlite = { version = "0.32", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
tempfile = "3"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
panic = "unwind"
