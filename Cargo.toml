[workspace]
resolver = "2"
members = [
    "crates/nexttool-core",
    "crates/nexttool-store",
    "crates/nexttool-tasks",
    "crates/nextsize-core",
    "crates/nextsize-scanner",
    "crates/nextsize-index",
    "crates/nextcopy-core",
    "crates/nextcopy-robocopy",
    "crates/nextcopy-verify",
    "crates/nexttool-cli",
    "crates/nexttool-desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Proprietary"

[workspace.dependencies]
nexttool-core = { path = "crates/nexttool-core" }
nexttool-store = { path = "crates/nexttool-store" }
nexttool-tasks = { path = "crates/nexttool-tasks" }
nextsize-core = { path = "crates/nextsize-core" }
nextsize-scanner = { path = "crates/nextsize-scanner" }
nextsize-index = { path = "crates/nextsize-index" }
nextcopy-core = { path = "crates/nextcopy-core" }
nextcopy-robocopy = { path = "crates/nextcopy-robocopy" }
nextcopy-verify = { path = "crates/nextcopy-verify" }

thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"
rusqlite = { version = "0.32", features = ["bundled", "hooks"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
blake3 = "1"
tempfile = "3"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
panic = "unwind"
